name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile and test
        run: ./gradlew check --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f docs/architecture.md
          test -f docs/responsibility-boundaries.md
          test -f docs/world-snapshot.md
          test -f docs/goals-and-tasks.md
          test -f docs/intent-trees.md
          test -f docs/conditions-and-confidence.md
          test -f docs/capabilities.md
          test -f docs/resources.md
          test -f docs/recovery.md
          test -f docs/decision-explanations.md
          test -f docs/trace-integration.md
          test -f docs/replay.md
          test -f docs/season-strategy.md
          test -f docs/performance.md
          test -f docs/safety.md
          test -f docs/readiness-gates.md
          test -f docs/student-learning-path.md
          test -f docs/mentor-guide.md
          test -f docs/troubleshooting.md
          test -f docs/research/ecosystem-review.md
          test -f docs/research/source-register.md
          test -f docs/research/build-vs-adopt.md
          test -f docs/research/team-code-case-studies.md
          test -f docs/adr/0015-authority-gates.md
