plugins {
    id 'java-library'
}

group = 'org.allsparks'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'GitHubPackagesAllsparksContracts'
        url = uri('https://maven.pkg.github.com/The-Allsparks/allsparks-contracts')
        credentials {
            username = findProperty('gpr.user') ?: System.getenv('GPR_USERNAME') ?: System.getenv('GITHUB_ACTOR') ?: ''
            password = findProperty('gpr.token') ?: System.getenv('GPR_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: ''
        }
    }
}

dependencies {
    // Public because HelmClock extends MonotonicClock and HelmMappings
    // returns CapabilityId / Availability / Validity / Confidence.
    // Does not pull TRACE, AMPER, or MIMIC.
    api 'org.allsparks:allsparks-contracts:0.1.0-rc.1'
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'HELM',
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': 'org.allsparks.helm'
        )
    }
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    failOnError = false
}
